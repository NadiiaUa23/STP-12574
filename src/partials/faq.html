<section id="faq" class="faq-section">
    <div class="container">
        <div class="faq-title-wrapper">
            <h2 class="faq-title">FAQ</h2>
        </div>

        <div class="faq-content">
            <!-- DESKTOP IMAGE -->
            <picture class="faq-image-wrapper">
                <source media="(min-width: 768px)" srcset="
            /img/faq/faq-desk-1x.png 1x,
            /img/faq/faq-desk-2x.png 2x" />

                <img class="faq-image" src="/img/faq/faq-desk-1x.png" alt="Bee Brilliant Blast" width="560"
                    height="560" />
            </picture>

            <!-- FAQ -->
            <ul class="faq-list">
                <li class="faq-item is-open">
                    <button class="faq-question" type="button">
                        <span>Is it different from match-3?</span>
                        <span class="faq-icon">−</span>
                    </button>

                    <div class="faq-answer">
                        <p>Yes. You tap groups instead of swapping tiles.</p>
                    </div>
                </li>

                <li class="faq-item">
                    <button class="faq-question" type="button">
                        <span>Is the game beginner-friendly?</span>
                        <span class="faq-icon">+</span>
                    </button>

                    <div class="faq-answer">
                        <p>Yes. Very easy to start.</p>
                    </div>
                </li>

                <li class="faq-item">
                    <button class="faq-question" type="button">
                        <span>Do levels get harder?</span>
                        <span class="faq-icon">+</span>
                    </button>

                    <div class="faq-answer">
                        <p>
                            Yeah, it starts pretty easy but definitely gets trickier as you
                            go.
                        </p>
                    </div>
                </li>

                <li class="faq-item">
                    <button class="faq-question" type="button">
                        <span>Are there boosters?</span>
                        <span class="faq-icon">+</span>
                    </button>

                    <div class="faq-answer">
                        <p>Yes. They help with tougher levels.</p>
                    </div>
                </li>

                <li class="faq-item">
                    <button class="faq-question" type="button">
                        <span>Can I play offline?</span>
                        <span class="faq-icon">+</span>
                    </button>

                    <div class="faq-answer">
                        <p>Most levels can be played anytime.</p>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</section>
